<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>数学小探险家 · 年级大厅</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="logo">🧭 数学小探险家</div>
  <div class="passport-mini">⭐ <span id="starAll">0</span> <small>全年级</small></div>
</header>
<main style="max-width:720px;margin:0 auto;padding:12px 12px 40px">
  <div class="card hero">
    <h1>选一个年级，开始探险！</h1>
    <p>1-6 年级 · 每天15分钟：3分钟热身 + 7分钟挑战 + 5分钟生活任务</p>
  </div>
  <div class="grade-grid" id="grades"></div>
  <div class="card tip">
    <h2>💡 给家长</h2>
    <p>每个年级进度独立保存；先从孩子所在年级开始，吃力就退回上一年级玩几天，不丢人。</p>
  </div>
</main>
<footer>本地运行，无需联网 · 进度保存在本机浏览器</footer>
<script>
const GRADES = [
  { n: 1, emoji: "🐣", topics: "凑十 · 20以内加减 · 钟表 · 图形", key: "mathAdv1" },
  { n: 2, emoji: "🐥", topics: "100以内笔算 · 口诀 · 混合运算 · 万以内数", key: "mathAdv2" },
  { n: 3, emoji: "🐤", topics: "万以内加减 · 时分秒 · 周长 · 分数初步 · 倍", key: "mathAdv3" },
  { n: 4, emoji: "🦊", topics: "大数 · 笔算乘除 · 运算定律 · 小数 · 平均数", key: "mathAdv4" },
  { n: 5, emoji: "🐯", topics: "小数乘除 · 方程 · 面积 · 因数倍数 · 分数 · 体积", key: "mathAdv5" },
  { n: 6, emoji: "🦁", topics: "分数乘除 · 比与比例 · 百分数 · 圆 · 圆柱圆锥", key: "mathAdv6" }
];
const total = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}").total || 0; } catch { return 0; } };
document.getElementById("grades").innerHTML = GRADES.map((g) =>
  `<a class="grade-card" href="grade${g.n}.html"><div class="g-emoji">${g.emoji}</div><div class="g-name">${g.n}年级</div><div class="g-topics">${g.topics}</div><div class="g-stars">⭐ ${total(g.key)}</div></a>`
).join("");
document.getElementById("starAll").textContent = GRADES.reduce((s, g) => s + total(g.key), 0);
</script>
</body>
</html>
